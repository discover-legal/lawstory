# Production service (applies at cutover, when site-v6 merges into main). The service keeps its
# existing name so a Blueprint sync updates it in place instead of creating a second service.
# Previews of site-v6 run on a separate free service created by hand (README, "Deploy"); never
# apply this file to a preview. /api/health is healthy on the old and the new site (PLAN C).
# maxShutdownDelaySeconds: 60 as on the old service (in-flight requests finish on a deploy).
services:
  - type: web
    name: affidavit-maker
    runtime: docker
    plan: starter
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://discover.legal
      - key: NEXT_PUBLIC_BOOKING_URL
        sync: false
      - key: NEXT_PUBLIC_BIGLAW_DEMO_URL
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
