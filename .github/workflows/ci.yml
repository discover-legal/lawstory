# site-v6 CI. One job, budget under 3 minutes (README "Test"). Actions are pinned by commit SHA.
name: ci
on:
  push:
    branches: [site-v6, 'site-v6-*']
  pull_request:
    branches: [site-v6]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run loc
      - run: npm run build
      - name: build leaves the tree clean (no config rewritten by next build)
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
