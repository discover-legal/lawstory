# CI: one run per change. Pushes to main (production after the cutover) and site-v6, and every PR
# into either (PR branches, Dependabot, forks; PR branches have no push trigger, so no double runs).
# A PR's runs share one group and a newer push cancels the older; pushes to main/site-v6 never cancel.
# Two jobs in parallel, each under 3 minutes (README "Test"). Actions pinned by SHA; Node from .nvmrc.
name: ci
on:
  push:
    branches: [main, site-v6]
  pull_request:
    branches: [main, site-v6]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev
      - run: npm run type-check
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run loc
      - run: npm run build
      - name: build leaves the tree clean (no config rewritten by next build)
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: standalone bundle has no sharp, and its server passes the smoke
        run: |
          test ! -e .next/standalone/node_modules/sharp && test ! -e .next/standalone/node_modules/@img
          PORT=3000 node .next/standalone/server.js &
          node scripts/smoke.mjs http://localhost:3000
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: docker build -t site:ci .
      - name: the image passes the smoke, runs as node, cannot rewrite its code and has no entrypoint
        run: |
          docker run -d --name site -p 3000:3000 site:ci
          node scripts/smoke.mjs http://localhost:3000
          test "$(docker exec site id -un)" = node
          if docker exec site touch /app/server.js; then echo 'app files are writable'; exit 1; fi
          test "$(docker inspect -f '{{json .Config.Entrypoint}}' site:ci)" = null
